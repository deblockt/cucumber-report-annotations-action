name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  direct-from-repository-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm execution without install/build
        uses: ./
        with:
          name: "Successful cucumber report direct from repository"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.json" # This committed report should be a success

  prepare:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Generate cucumber reports
        # language=bash
        run: |
          npm run cucumber || true
          npm run cucumber-ok || true
          npm run cucumber-non-failed || true
          npm run cucumber-empty || true
      - uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            cucumber-report*.json
            cucumber-report*.ndjson
          if-no-files-found: error
      - name: Build the test cases matrix from test/e2e/cases.yml
        id: cases
        run: npx tsx test/e2e/write-matrix.ts

  # runs the action once per case of test/e2e/cases.yml
  action-test:
    name: "e2e - ${{ matrix.case.checkName }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove the committed report, replaced by the generated one
        run: rm cucumber-report.json
      - uses: actions/download-artifact@v4
        with:
          name: cucumber-reports
      # each action.yml input must be listed here, test/e2e/cases.ts checks it
      - uses: ./
        id: action
        continue-on-error: true
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ matrix.case.inputs['name'] }}
          path: ${{ matrix.case.inputs['path'] }}
          check-status-on-error: ${{ matrix.case.inputs['check-status-on-error'] }}
          check-status-on-undefined: ${{ matrix.case.inputs['check-status-on-undefined'] }}
          check-status-on-pending: ${{ matrix.case.inputs['check-status-on-pending'] }}
          annotation-status-on-error: ${{ matrix.case.inputs['annotation-status-on-error'] }}
          annotation-status-on-undefined: ${{ matrix.case.inputs['annotation-status-on-undefined'] }}
          annotation-status-on-pending: ${{ matrix.case.inputs['annotation-status-on-pending'] }}
          show-number-of-error-on-check-title: ${{ matrix.case.inputs['show-number-of-error-on-check-title'] }}
          show-global-summary-report: ${{ matrix.case.inputs['show-global-summary-report'] }}
          number-of-test-error-to-fail-job: ${{ matrix.case.inputs['number-of-test-error-to-fail-job'] }}
          max-number-of-annotations: ${{ matrix.case.inputs['max-number-of-annotations'] }}
          ignore-no-report-found: ${{ matrix.case.inputs['ignore-no-report-found'] }}
          job-summary-content: ${{ matrix.case.inputs['job-summary-content'] }}
      - name: Check the action outcome and outputs
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUTS: ${{ toJSON(steps.action.outputs) }}
          EXPECTED: ${{ toJSON(matrix.case.expect) }}
        with:
          script: |
            const expected = JSON.parse(process.env.EXPECTED);
            const outputs = JSON.parse(process.env.OUTPUTS);
            const errors = [];
            if (process.env.OUTCOME !== expected.outcome) {
              errors.push(`expected outcome ${expected.outcome}, got ${process.env.OUTCOME}`);
            }
            for (const [name, value] of Object.entries(expected.outputs)) {
              if (outputs[name] !== value) {
                errors.push(`expected output ${name}=${value}, got ${outputs[name]}`);
              }
            }
            if (errors.length) core.setFailed(errors.join('\n'));

  verify-expected-checks:
    needs: [direct-from-repository-test, action-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check the check runs, then neutralize the expected failures
        run: npx tsx test/e2e/verify-checks.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
