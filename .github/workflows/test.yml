name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  direct-from-repository-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm execution without install/build
        uses: ./
        with:
          name: "Successful cucumber report direct from repository"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.json" # This committed report should be a success

  ubuntu-action-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension: ["json", "ndjson"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run cucumber || true
      - run: npm run cucumber-ok || true
      - run: npm run cucumber-undefined || true
      - run: npm run cucumber-non-failed || true
      - run: npm run cucumber-empty || true
      - uses: ./
        name: "fail because of error"
        with:
          name: "${{ matrix.extension }}: failed cucumber report"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.${{ matrix.extension }}"
      - uses: ./
        name: "fail because of error (without number of error)"
        with:
          name: "${{ matrix.extension }}:  failed (no number of error)"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.${{ matrix.extension }}"
          show-number-of-error-on-check-title: false
      - uses: ./
        name: "fail because of error with all annotation"
        with:
          name: "${{ matrix.extension }}: failed with all annotation"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.${{ matrix.extension }}"
          show-number-of-error-on-check-title: false
          annotation-status-on-undefined: notice
          annotation-status-on-pending: notice
      - uses: ./
        name: "fail because of undefined test"
        with:
          name: "${{ matrix.extension }}: failed because of undefined test"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-non-failed.${{ matrix.extension }}"
          check-status-on-undefined: "failure"
          annotation-status-on-undefined: "failure"
      - uses: ./
        name: "fail because of pending test"
        with:
          name: "${{ matrix.extension }}: failed because of pending test"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-non-failed.${{ matrix.extension }}"
          check-status-on-pending: "failure"
          annotation-status-on-pending: "failure"
      - uses: ./
        name: "neutral because of error"
        with:
          name: "${{ matrix.extension }}: neutral cucumber report"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.${{ matrix.extension }}"
          check-status-on-error: 'neutral'
          annotation-status-on-error: 'warning'
      - uses: ./
        name: "sucess because all is ok"
        with:
          name: "${{ matrix.extension }}: success cucumber report"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-ok.${{ matrix.extension }}"
          check-status-on-error: 'neutral'
          annotation-status-on-error: 'warning'
      - uses: ./
        id: success-with-empty-cucumber-report
        name: "success with empty cucumber report"
        with:
          name: "${{ matrix.extension }}: success empty report"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-empty.${{ matrix.extension }}"
      - uses: ./
        name: "job with summary"
        with:
          name: "${{ matrix.extension }}: job with summary"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report.${{ matrix.extension }}"
          show-global-summary-report: 'true'
      - uses: ./
        name: "job with summary and scenarios excluded by tag filter"
        with:
          name: "${{ matrix.extension }}: job with summary and tag filter"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-ok.${{ matrix.extension }}"
          show-global-summary-report: 'true'
      - id: check-output
        name: "check output for cucumber-report-empty"
        if: steps.success-with-empty-cucumber-report.outputs.cucumber-report-empty_failed_scenarios != 0
        run: exit 1
      - uses: ./
        id: set-fail-file-not-found
        continue-on-error: true
        name: "fail because no report found"
        with:
          path: "**/report-not-found.json"
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./
        id: set-success-when-no-file-found
        continue-on-error: true
        name: "success because ignore no file found"
        with:
          path: "**/report-not-found.json"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          ignore-no-report-found: 'true'
      - name: 'check that set-fail-file-not-found outcome is failed'
        if: steps.set-fail-file-not-found.outcome == 'failure'
        run: exit 0
      - name: 'check that set-fail-file-not-found outcome is failed'
        if: steps.set-fail-file-not-found.outcome != 'failure'
        run: exit 1
      - uses: ./
        id: job-failed
        continue-on-error: true
        name: "fail job due to failed test"
        with:
          name: "${{ matrix.extension }}: fail job due to failed test"
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "**/cucumber-report-non-failed.${{ matrix.extension }}"
          check-status-on-pending: "failure"
          annotation-status-on-pending: "failure"
          number-of-test-error-to-fail-job: 1
      - name: 'check that job-failed outcome is failed'
        if: steps.job-failed.outcome == 'failure'
        run: exit 0
      - name: 'check that job-failed outcome is failed'
        if: steps.job-failed.outcome != 'failure'
        run: exit 1

  verify-expected-checks:
    needs: [direct-from-repository-test, ubuntu-action-tests]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: "check conclusions and summaries, then neutralize expected failures"
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request?.head.sha ?? context.sha;
            const summaries = {
              committed: ['1 Scenarios (1 passed)', '1 Steps (1 passed)'],
              full: ['7 Scenarios (2 failed, 3 undefined, 1 pending, 1 passed)', '9 Steps (2 failed, 3 undefined, 1 skipped, 1 pending, 2 passed)'],
              nonFailed: ['3 Scenarios (1 undefined, 1 pending, 1 passed)', '4 Steps (1 undefined, 1 pending, 2 passed)'],
              ok: ['2 Scenarios (1 undefined, 1 passed)', '3 Steps (1 undefined, 2 passed)'],
              empty: ['0 Scenarios ()', '0 Steps ()'],
            };
            const expected = {
              'Successful cucumber report direct from repository': { conclusion: 'success', summary: summaries.committed },
            };
            for (const ext of ['json', 'ndjson']) {
              Object.assign(expected, {
                [`${ext}: failed cucumber report`]: { conclusion: 'failure', summary: summaries.full },
                [`${ext}:  failed (no number of error)`]: { conclusion: 'failure', summary: summaries.full },
                [`${ext}: failed with all annotation`]: { conclusion: 'failure', summary: summaries.full },
                [`${ext}: failed because of undefined test`]: { conclusion: 'failure', summary: summaries.nonFailed },
                [`${ext}: failed because of pending test`]: { conclusion: 'failure', summary: summaries.nonFailed },
                [`${ext}: neutral cucumber report`]: { conclusion: 'neutral', summary: summaries.full },
                [`${ext}: success cucumber report`]: { conclusion: 'success', summary: summaries.ok },
                [`${ext}: success empty report`]: { conclusion: 'success', summary: summaries.empty },
                [`${ext}: job with summary`]: { conclusion: 'failure', summary: summaries.full },
                [`${ext}: job with summary and tag filter`]: { conclusion: 'success', summary: summaries.ok },
                [`${ext}: fail job due to failed test`]: { conclusion: 'failure', summary: summaries.nonFailed },
              });
            }
            const errors = [];
            const toNeutralize = [];
            for (const [name, { conclusion, summary }] of Object.entries(expected)) {
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref, check_name: name, filter: 'latest' });
              const run = data.check_runs[0];
              if (!run) { errors.push(`${name}: check not found`); continue; }
              if (run.conclusion !== conclusion) {
                errors.push(`${name}: expected conclusion ${conclusion}, got ${run.conclusion}`);
              }
              const actualSummary = (run.output.summary ?? '').split('\n').map(line => line.trim()).join('\n');
              if (actualSummary !== summary.join('\n')) {
                errors.push(`${name}: expected summary\n${summary.join('\n')}\ngot\n${actualSummary}`);
              }
              if (run.conclusion === 'failure' && conclusion === 'failure') {
                toNeutralize.push(run.id);
              }
            }
            if (errors.length) {
              core.setFailed(errors.join('\n\n'));
              return;
            }
            for (const checkRunId of toNeutralize) {
              await github.rest.checks.update({ ...context.repo, check_run_id: checkRunId, conclusion: 'neutral' });
            }
